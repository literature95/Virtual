include: package:dart_frog_lint/recommended.yaml

# 服务端项目：放宽对内部服务无意义的噪音 lint
# （80 字符行宽、强制文档注释、编译期环境变量属 dart_frog 模板正当用法）
linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    do_not_use_environment: false
    omit_local_variable_types: false
    avoid_redundant_argument_values: false
    always_use_package_imports: false
    # 角色卡文案（description / example_messages 等）必须精确换行书写：
    # 多一个前导空行就等于往 prompt 里注入一行空白，故禁用该规则。
    leading_newlines_in_multiline_strings: false