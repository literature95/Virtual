plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.2.1'
}

android {
    namespace "app.bitbear.virtual"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // 本地模型（GGUF）以 **stored（不压缩）** 方式打入 APK：
    // 量化后的 GGUF 本身几乎不可压缩，压缩只会让构建变慢并在首次运行时
    // 解压产生额外拷贝开销。运行期由 MainActivity 的 MethodChannel
    // 以流式方式复制到应用私有目录（不从 Dart 堆里读整份 532MB）。
    androidResources {
        noCompress 'gguf'
    }

    signingConfigs {
        release {
            storeFile file('tav-release.jks')
            storePassword 'tav123456'
            keyAlias 'tav-release'
            keyPassword 'tav123456'
        }
    }

    defaultConfig {
        applicationId "app.bitbear.virtual"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    // 只出 arm64-v8a：`--target-platform android-arm64` 只约束 Flutter 自身产物
    // （libapp.so / libflutter.so），插件 AAR（如 nobodywho）仍会自带 x86_64 的
    // 原生库（约 121MB）。这里显式剔除，避免 APK 白胖 120MB+。
    packagingOptions {
        jniLibs {
            excludes += ['lib/x86_64/**', 'lib/armeabi-v7a/**']
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.window:window:1.3.0'
}
