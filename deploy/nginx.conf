# Virtual 生产 nginx 配置（单服务器：nginx + 后端 + 宿主 PG）
# 放置位置（Ubuntu/Debian）：/etc/nginx/sites-available/virtual
# 然后 `ln -s /etc/nginx/sites-available/virtual /etc/nginx/sites-enabled/`
# 并删除 /etc/nginx/sites-enabled/default 以免冲突
#
# 域名：virtual.literature95.com（证书自备，见仓库 ssl/ 文件夹）
# 部署时把 ssl/ 上传到服务器 /etc/nginx/ssl/virtual/

# 80 → 443 跳转（HTTPS 强制）
server {
    listen 80;
    listen [::]:80;
    server_name virtual.literature95.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name virtual.literature95.com;

    # ── SSL 证书（自备：仓库 ssl/virtual.literature95.com.{pem,key} 上传到 /etc/nginx/ssl/virtual/）──
    ssl_certificate     /etc/nginx/ssl/virtual/virtual.literature95.com.pem;
    ssl_certificate_key /etc/nginx/ssl/virtual/virtual.literature95.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── 请求体大小上限 ──
    # nginx 默认仅 1MB。上传带立绘的角色卡时，PNG 动辄数 MB → 会被 nginx 以
    # 413 Payload Too Large 直接拒绝（请求根本到不了后端，后端日志无记录）。
    # 放宽到 32MB 以容纳大立绘；超限时前端应给出可读提示。
    client_max_body_size 32m;

    # ── 静态网站根目录：Virtual_web 构建产物 dist/ ──
    # 构建命令：cd Virtual_web && npm ci && npm run build
    root /var/www/virtual/dist;
    index index.html;

    # SPA 历史路由回退（刷新子路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反代到本地后端（仅本机回环 127.0.0.1:8080）──
    # 注意：必须用 ^~ 前缀修饰符，使其优先级高于下面的静态资源正则 location。
    # 否则 /api/avatars/*.jpg 会被正则匹配当成静态文件从 dist/ 取 → 404。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式响应（SSE）不要缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
